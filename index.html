<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FED Play · App Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body class="dark">
    <div class="app-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- SIDEBAR (built by app.js) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- MAIN -->
        <main class="main-content">
            <!-- page-specific content; top bar + categories injected by layout.js -->
            <div id="fedContent">
                <div class="container">
                    <!-- FEATURED HERO -->
                    <section class="featured-section">
                        <div class="featured-hero" id="featuredAppContainer"></div>
                        <div class="featured-indicators" id="featuredIndicators"></div>
                    </section>

                    <!-- CAROUSEL -->
                    <section class="carousel-section">
                        <div class="carousel-header">
                            <h2>🔥 Trending Now</h2>
                            <span class="trending-tag"><span class="live-dot"></span> live</span>
                        </div>
                        <div class="carousel-container" id="carouselContainer">
                            <button class="carousel-btn prev" id="carouselPrev" aria-label="Previous">‹</button>
                            <div class="carousel-track" id="carouselTrack" role="list"></div>
                            <button class="carousel-btn next" id="carouselNext" aria-label="Next">›</button>
                        </div>
                    </section>

                    <!-- APP GRID -->
                    <div class="section-title">
                        <h2 id="gridTitle">📦 Most Wanted</h2>
                        <span class="sub-tag" id="gridSub">sideload ready</span>
                    </div>
                    <div class="app-grid" id="appGrid" role="list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script src="app.js"></script>
    <script>
        // Page config for the main hub
        window.FED_PAGE = {
            tab: 'apps',
            featuredIds: ['deviantart', 'kofi', 'fedplay', 'seeflix'],
            gridTitle: '📦 Most Wanted',
            gridSub: 'sideload ready',
            welcome: 'the ultimate app store'
        };
        FED_LAYOUT.inject();
        FED.init();
    </script>
</body>
</html>
